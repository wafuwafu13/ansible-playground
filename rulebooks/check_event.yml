---
- name: 障害検知ルールブック
  hosts: all
  sources:
    - ansible.eda.webhook:
        port: 5000
  rules:
    - name: ステータスが "down" ならPlaybookを動かす
      condition: event.payload.status == "down"
      action:
        run_job_template:
          name: eda
          organization: Default
          job_args:
            extra_vars:
              eda_event: "{{ event }}"